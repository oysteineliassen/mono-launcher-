name: Launcher

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Et nytt bygg på samme gren avbryter det forrige, så bare det siste bruker minutter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Byggnummer
        # +100 så versjonene fortsetter over byggene fra det gamle test-repoet (siste var 61).
        run: echo "BYGGNR=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bygg APK
        run: gradle --no-daemon assembleRelease assembleDebug

      - name: Gi APK-ene lesbare navn
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Launcher-1.0.${BYGGNR}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk out/launcher-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Launcher-apk
          path: out/Launcher-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-debug-apk
          path: out/launcher-debug.apk
          retention-days: 3

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Byggnummer
        # +100 så versjonene fortsetter over byggene fra det gamle test-repoet (siste var 61).
        run: echo "BYGGNR=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: launcher-debug-apk

      - uses: actions/download-artifact@v4
        with:
          name: Launcher-apk

      - name: Slå på KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Røyktest på Android-emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r launcher-debug.apk
            node test/smoke.mjs
            adb uninstall no.oystein.launcher
            adb install Launcher-*.apk
            QUICK=1 node test/smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-skjermbilder
          path: skjerm-*.png
          if-no-files-found: ignore

  release:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Byggnummer
        # +100 så versjonene fortsetter over byggene fra det gamle test-repoet (siste var 61).
        run: echo "BYGGNR=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: Launcher-apk

      - name: Lag zip av APK-en
        run: zip -9 "Launcher-1.0.${BYGGNR}.zip" Launcher-*.apk

      - name: Publiser som release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v1.0.${{ env.BYGGNR }}
          name: Launcher 1.0.${{ env.BYGGNR }}
          files: |
            Launcher-*.apk
            Launcher-*.zip
          body: |
            Last ned zip-filen hvis APK-nedlastingen henger på telefonen, og pakk den ut der.
            Minimalistisk launcher. Installer med `adb install -r Launcher-1.0.${{ env.BYGGNR }}.apk`,
            eller last ned APK-en på telefonen og åpne den.
